    <script>
      (function() {
        const projectsData = {
          'ai-farming-drone': {
            title: 'AI Farming Drone',
            desc: 'The system integrates a high-performance software pipeline tailored for edge-computing hardware, enabling the quadcopter to process high-resolution aerial feeds locally without relying on cloud connectivity. Equipped with a high-efficiency multi-spectral camera, the drone captures detailed structural data to run real-time anomaly checks. The onboard vision model instantly flags localized plant pathologies, tracks overall crop health metrics, and registers precise GPS coordinates to generate an actionable stress map for automated field diagnostics.',
            techStack: [
              ['TensorFlow & PyTorch', 'Powers the core Convolutional Neural Network (CNN) for fine-grained, multi-class plant disease classification.'],
              ['OpenCV', 'Handles real-time video stream ingestion, frame stabilization, and dynamic HSV color-space masking to isolate foliage.'],
              ['Embedded Deployment', 'Optimized for low-power, high-FPS inference on onboard edge hardware.'],
              ['Flight Integration', 'Synchronizes high-efficiency camera feeds with telemetry data for precise, geotagged crop monitoring.']
            ],
            image: 'assets/img/project1.jpg',
            image2: 'assets/img/drone.JPEG',
            github: 'https://github.com/mohitroscen/Ai-farming-drone-for-disease-detection-'
          },
          'ai-traffic-light-system': {
            title: 'AI Traffic Light System',
            desc: 'An intelligent computer-vision driven urban traffic signal controller designed to eliminate static timer bottlenecks at complex intersections. The system ingests live HD camera streams across multiple lanes, running real-time vehicle detection and tracking algorithms. It dynamically calculates queue lengths, vehicle speeds, and lane occupancy to continuously adjust green-light signal durations, prioritizing congested corridors and providing emergency vehicle preemption.',
            techStack: [
              ['YOLOv8 & PyTorch', 'Performs real-time multi-class vehicle detection, classification (cars, buses, trucks, ambulances), and speed estimation.'],
              ['OpenCV', 'Manages multi-stream video decoding, Region of Interest (ROI) lane masking, and visual queue density analysis.'],
              ['Dynamic Logic Engine', 'Custom mathematical optimization algorithm that re-calculates signal phase timing on every cycle to minimize overall intersection delay.'],
              ['Emergency Preemption', 'Detects emergency vehicle visual signatures and acoustic triggers to force immediate green corridors.']
            ],
            image: 'assets/img/project2.jpg',
            image2: 'assets/img/traffic.jpg',
            github: 'https://github.com/mohitroscen/Samrt-Traffic-Light-Mangment-Sytem-'
          },
          'icu-alert-system': {
            title: 'ICU-Alert System',
            desc: 'A critical care patient monitoring and early-warning alert system developed for Intensive Care Units to prevent silent physiological deterioration. The platform interfaces with bedside medical sensors to continuously ingest multi-parameter telemetry including heart rate, SpO2, blood pressure, and respiration rate. Using time-series anomaly detection algorithms, it predicts adverse medical events minutes before critical thresholds are breached, firing instant visual and auditory alerts to nursing stations.',
            techStack: [
              ['Time-Series ML Models', 'Employs LSTM & Isolation Forests to model non-linear physiological baseline trends and detect subtle vitals degradation.'],
              ['Real-Time Telemetry Pipeline', 'Built with lightweight WebSockets and MQTT protocols for zero-latency sensor streaming to central monitoring stations.'],
              ['React & Canvas UI', 'Features high-frequency waveform plotting and color-coded risk prioritization dashboards for medical staff.'],
              ['Clinical Threshold Rules', 'Combines machine learning anomaly scores with strict medical clinical alert boundaries for zero false negatives.']
            ],
            image: 'assets/img/project3.jpg',
            image2: 'assets/img/icu-alert.JPEG',
            github: 'https://github.com/mohitroscen/Icu--Alert-system-'
          },
          'ai-weather-prediction': {
            title: 'AI Weather Prediction',
            desc: 'An advanced meteorological forecasting framework leveraging deep learning neural networks to predict hyper-local microclimate shifts and severe weather events. By processing historical atmospheric datasets, satellite imagery, and ground weather station telemetry, the model learns intricate spatial-temporal patterns to generate accurate short-term rainfall, temperature, and wind speed forecasts far faster than conventional numerical weather models.',
            techStack: [
              ['ConvLSTM & Transformer', 'Spatio-temporal neural architectures for modeling complex atmospheric fluid dynamics and radar imagery prediction.'],
              ['NetCDF & Raster Pipeline', 'Handles large-scale multi-dimensional climate datasets (ERA5, satellite radar grids) with NumPy and xarray.'],
              ['FastAPI Backend', 'Exposes high-speed RESTful API endpoints delivering real-time weather probability maps and alert notifications.'],
              ['Interactive Web Dashboard', 'Visualizes temperature contours, precipitation radar overlays, and wind vector animations in real time.']
            ],
            image: 'assets/img/project4.jpeg',
            image2: 'assets/img/ai-weather.jpg',
            github: 'https://github.com/mohitroscen/ai-weather-intelligence',
            live: 'https://ai-weather-intelligence-g9tuzwtz7ue4kvplgatane.streamlit.app/'
          },
          'ai-medic-chatbot': {
            title: 'AI Medic Chatbot',
            desc: 'An intelligent conversational AI health assistant designed to provide accessible, 24/7 medical information, preliminary symptom assessment, and triage guidance. Trained on verified clinical knowledge repositories and medical literature, the chatbot interacts naturally with users to evaluate symptoms, ask targeted clarifying questions, assess urgency levels, and offer evidence-based first-aid or physician referral recommendations.',
            techStack: [
              ['LLM & Fine-Tuned NLP', 'Utilizes domain-adapted Transformer language models fine-tuned on curated medical QA and clinical dialogue datasets.'],
              ['RAG Architecture', 'Retrieval-Augmented Generation retrieving medical facts from medical knowledge graphs to eliminate hallucinations.'],
              ['Triage & Risk Engine', 'Implements standardized clinical triage protocols (Emergency Severity Index) to categorize user risk levels.'],
              ['Privacy & Security', 'Ensures zero-log anonymized user sessions with encrypted communication to protect sensitive health queries.']
            ],
            image: 'assets/img/project5.jpg',
            image2: '',
            github: 'https://github.com/mohitroscen'
          },
          'multipurpose-rover': {
            title: 'Multipurpose Rover',
            desc: 'A rugged, custom-engineered robotic terrain vehicle engineered for hazardous environment inspection, payload transport, and remote exploration. The rover features a heavy-duty rocker-bogie suspension system for high obstacle traversal, a 4-DOF articulated robotic manipulator arm, and onboard telemetry sensors. Operated via wireless long-range RF and Wi-Fi links, it feeds live video and sensor diagnostic data back to a remote ground control station.',
            techStack: [
              ['Embedded Microcontrollers', 'Arduino & ESP32 architecture managing motor pulse-width modulation (PWM), servo arm control, and sensor reading.'],
              ['Wireless Control Pipeline', 'Dual-band 2.4GHz Wi-Fi & NRF24L01 long-range telemetry link for low-latency command processing and video stream.'],
              ['Mechanical Kinematics', 'Inverse kinematics calculations for 4-DOF robotic arm manipulation and claw payload grabbing.'],
              ['Sensors & Video Feed', 'Integrated ultrasonic proximity arrays, IMU orientation tracking, and high-definition FPV camera stream.']
            ],
            image: 'assets/img/project6.jpg',
            image2: '',
            github: 'https://github.com/mohitroscen'
          }
        };

        window.initProjectDetail = function(customUrl) {
          const urlStr = customUrl || window.location.href;
          let id = 'ai-farming-drone';
          try {
            const urlObj = new URL(urlStr, window.location.origin);
            id = urlObj.searchParams.get('id') || 'ai-farming-drone';
          } catch(e) {
            const match = urlStr.match(/[?&]id=([^&]+)/);
            if (match) id = match[1];
          }

          const proj = projectsData[id] || projectsData['ai-farming-drone'];

          const pageTitle = document.getElementById('page-title');
          if (pageTitle) pageTitle.innerText = proj.title + ' | Mohit Roscen';

          const projTitle = document.getElementById('proj-title');
          if (projTitle) projTitle.innerText = proj.title;

          const projDesc = document.getElementById('proj-desc');
          if (projDesc) projDesc.innerText = proj.desc;

          const liveLink = document.getElementById('live-link');
          if (liveLink) {
            if (proj.live) {
              liveLink.href = proj.live;
              liveLink.style.display = 'inline-flex';
            } else {
              liveLink.style.display = 'none';
            }
          }

          const githubLink = document.getElementById('github-link');
          if (githubLink) {
            if (proj.github) {
              githubLink.href = proj.github;
              githubLink.style.display = 'inline-flex';
            } else {
              githubLink.style.display = 'none';
            }
          }

          // Tech Stack Bullets
          const techList = document.getElementById('proj-tech-list');
          const techContainer = document.getElementById('tech-stack-container');
          if (techList && proj.techStack && proj.techStack.length > 0) {
            techList.innerHTML = '';
            proj.techStack.forEach(([title, detail]) => {
              const li = document.createElement('li');
              li.className = 'tech-bullet-item';
              li.innerHTML = `<strong>${title}:</strong> ${detail}`;
              techList.appendChild(li);
            });
            if (techContainer) techContainer.style.display = 'block';
          } else if (techContainer) {
            techContainer.style.display = 'none';
          }

          // Images
          const img1 = document.getElementById('proj-image');
          const img1Container = document.getElementById('proj-image-1-container');
          if (img1) {
            if (proj.image) {
              img1.src = proj.image;
              img1.alt = proj.title;
              if (img1Container) img1Container.style.display = 'block';
            } else if (img1Container) {
              img1Container.style.display = 'none';
            }
          }

          const img2Container = document.getElementById('proj-image-2-container');
          const img2 = document.getElementById('proj-image-2');
          if (img2) {
            if (proj.image2) {
              img2.src = proj.image2;
              img2.alt = proj.title;
              if (img2Container) img2Container.style.display = 'block';
            } else if (img2Container) {
              img2Container.style.display = 'none';
            }
          }
        };

        window.initProjectDetail();
      })();
    </script>
